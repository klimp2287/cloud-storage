version: '3.7'

services:

  server:
    image: backend
    container_name: 'cloud-storage-server'
    build: ./
    ports:
      - "5050:5050"
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/netology
      SPRING_DATASOURCE_USERNAME: netology
      SPRING_DATASOURCE_PASSWORD: netology
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_LIQUIBASE_URL: jdbc:postgresql://database:5432/netology
      SPRING_LIQUIBASE_USER: netology
      SPRING_LIQUIBASE_PASSWORD: netology

  database:
    image: postgres:14
    container_name: 'cloud-storage-db'
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: netology
      POSTGRES_PASSWORD: netology
      POSTGRES_DB: netology
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netology -d netology"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data: