services:
  server:
    image: backend
    container_name: cloud-storage-server
    build: .
    ports:
      - "5050:5050"
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/cloud_storage
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      JWT_SECRET: cloud-storage-local-development-secret-2026
      CORS_ORIGINS: http://localhost:8080
      CORS_CREDENTIALS: "true"
      CORS_METHODS: GET,POST,PUT,DELETE,OPTIONS
      CORS_HEADERS: "*"

  database:
    image: postgres:14
    container_name: cloud-storage-db
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cloud_storage
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloud_storage"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data: