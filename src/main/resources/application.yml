server:
  port: 5050

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cloud_storage
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

cors:
  origins: http://localhost:8082
  credentials: true
  methods: GET,POST,PUT,DELETE,OPTIONS
  headers: "*"

jwt:
  token:
    secret: ${JWT_SECRET}
    expiration: 18000